<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F5" />
    <style>html{background:#F7F7F5}html[data-theme=dark]{background:#101110}</style>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('bs42-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101110' : '#F7F7F5';
      })();
    </script>
    <meta name="description" content="Your complete Bangsaen42 marathon plan, long run roadmap and guardrails. Available offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BS42" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <title>BS42 · Bangsaen Marathon 2026</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
